<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synchrotron Atlas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
/* Layout: one control strip over a full-width map; the map is the page.
   Page colors and fonts match index.html / style.css. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --fg:#1f2933; --muted:#6b7785; --line:#e3e6ea;
  --ocean:#dde7ec; --land:#eceee8; --border:#b9c1c6; --coast:#9aa6ad;
  --accent:#2563eb; --op:#14907a; --plan:#d99a00; --dec:#7b8894;
  --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171c; --panel:#1d2128; --fg:#e6e9ee; --muted:#8b96a3; --line:#2b3039;
  --ocean:#14202a; --land:#222b31; --border:#3d4952; --coast:#4c5a64;
  --accent:#60a5fa; --op:#2dbf9f; --plan:#f0b429; --dec:#8b98a3; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1d2128; --fg:#e6e9ee; --muted:#8b96a3; --line:#2b3039;
  --ocean:#14202a; --land:#222b31; --border:#3d4952; --coast:#4c5a64;
  --accent:#60a5fa; --op:#2dbf9f; --plan:#f0b429; --dec:#8b98a3; --shadow:none; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:2rem 16px;display:grid;gap:12px;max-width:1400px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.back{flex-basis:100%;font-size:.9rem;color:var(--accent);text-decoration:none}
.back:hover{text-decoration:underline}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.count{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
.ctl{display:grid;gap:4px;min-width:0}
.ctl>span{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* Every control row is the same height and bottom-aligned, so the small
   labels above them line up. */
.controls{--ctl-h:34px}
.controls select,.controls button{font:inherit;font-size:.875rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 8px;height:var(--ctl-h);box-sizing:border-box}
.controls select:focus-visible,.controls button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:6px;font-size:.875rem;height:var(--ctl-h)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.switch{display:flex;align-items:center;gap:8px;font-size:.875rem;height:var(--ctl-h);cursor:pointer;color:var(--muted)}
.switch .on{color:var(--fg)}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--muted);position:relative;margin:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s}
.switch input:checked::after{transform:translateX(18px)}
@media (prefers-reduced-motion:reduce){.switch input::after{transition:none}}
.switch:has(input:disabled){opacity:.45;cursor:default}
.switch input:disabled{cursor:default}
.controls button{cursor:pointer;background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}
.controls button:disabled{opacity:.45;cursor:default}
.push{margin-left:auto;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.push .ctl{margin-right:32px}
.msg{font-size:.8rem;color:var(--muted);line-height:var(--ctl-h)}
#map{width:100%;height:clamp(360px,68vh,760px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
#map.link-hover *{cursor:pointer!important}
.pop{position:fixed;z-index:10;min-width:200px;max-width:min(320px,calc(100vw - 16px));padding:4px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.14);font-size:.875rem}
.pop a,.pop .nolink{display:grid;gap:1px;padding:6px 12px;color:var(--fg);text-decoration:none}
.pop a:hover,.pop a:focus-visible{background:var(--bg);outline:none}
.pop a .nm::after{content:" ↗";color:var(--accent)}
.pop .st{font-size:.75rem;color:var(--muted)}
.pop .nolink{color:var(--muted)}
footer{font-size:.75rem;color:var(--muted)}
@media (max-width:560px){.push{margin-left:0}}
/* MapLibre version: overlays on the map */
.mapwrap{position:relative}
#map{background:var(--panel)}
.badges{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;border-radius:var(--radius)}
.maplibregl-popup{z-index:2}   /* hover box above the count badges */
/* Hover box expanded into a link list after clicking a grouped pin */
.tip-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.tip-close{all:unset;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.tip-close:hover,.tip-close:focus-visible{color:var(--fg)}
.tip-list{display:grid;gap:1px;margin:0 -6px}
.tip-list a,.tip-list .nolink{display:grid;padding:4px 6px;border-radius:4px;color:var(--fg);text-decoration:none}
.tip-list a:hover,.tip-list a:focus-visible{background:var(--bg);outline:none}
.tip-list a .nm::after{content:" ↗";color:var(--accent)}
.tip-list .st{font-size:11px;color:var(--muted)}
.tip-list .nolink{color:var(--muted)}
/* Fullscreen: the whole map area (map, badges, legend, link menu) fills the screen */
.mapwrap:fullscreen{background:var(--panel)}
.mapwrap:fullscreen #map{height:100vh;border:0;border-radius:0;box-shadow:none}
.mapwrap:fullscreen .badges{border-radius:0}
.badge{position:absolute;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#e5484d;color:#fff;border:1.5px solid #fff;font:700 10px/13px var(--sans);text-align:center;transform:translate(-50%,-50%);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.legend{position:absolute;left:10px;bottom:10px;z-index:2;display:grid;gap:2px;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:12px}
.legend button{all:unset;display:flex;align-items:center;gap:8px;padding:1px 2px;cursor:pointer;color:var(--fg);border-radius:3px}
.legend button:focus-visible{outline:2px solid var(--accent)}
.legend button.off{opacity:.4}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.maplibregl-popup-content{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:12px/1.45 var(--sans);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.maplibregl-popup-tip{display:none}
.maplibregl-ctrl-reset{font-size:16px;line-height:1}
</style>
</head><body>

<div class="wrap">
  <header>
    <a class="back" href="index.html">&larr; SRIR Book</a>
    <h1>Synchrotron Atlas</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="controls">
    <div class="ctl"><span>Projection</span>
      <label class="switch"><span class="on">Mercator</span><input type="checkbox" role="switch" id="proj" aria-label="Globe projection"><span>Globe</span></label></div>
    <label class="check"><input type="checkbox" id="bysize"> Size by ring diameter</label>
    <div class="ctl"><span>Size scale</span>
      <label class="switch"><span class="on">√ diameter</span><input type="checkbox" role="switch" id="scale" aria-label="Linear size scale" disabled><span>Linear</span></label></div>
    <label class="check"><input type="checkbox" id="bystatus" checked> Color by status</label>
    <label class="check"><input type="checkbox" id="srir"> Highlight SR-IR</label>
    <div class="push"><span class="msg" id="msg" aria-live="polite"></span><button id="save" disabled>Save PNG</button></div>
  </div>
  <div class="mapwrap">
    <div id="map"></div>
    <div id="badges" class="badges"></div>
    <div id="legend" class="legend"></div>
  </div>
</div>

<script type="module">
// MapLibre GL JS 6 (ES module from jsDelivr; it loads its own worker from there too).
import * as maplibregl from "https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.mjs";

// Facility data — locations, details, website links and SR-IR flags — lives in
// data/facilities.geojson (one facility per line). Edit that file to add or change
// facilities; every map page reads it. (Needs a web server: browsers block
// fetch() from pages opened as local files.)
let DATA;
try{
  DATA=await fetch("data/facilities.geojson").then(r=>{if(!r.ok) throw new Error("HTTP "+r.status);return r.json()});
}catch(e){
  document.getElementById("map").innerHTML='<p style="padding:24px;color:var(--muted)">Couldn\'t load the facility data (data/facilities.geojson). '+
    'If you opened this file directly from disk, serve the folder instead, e.g. <code>python3 -m http.server</code>.</p>';
  throw e;
}
const URLS=Object.fromEntries(DATA.features.filter(f=>f.properties.url).map(f=>[f.properties.name,f.properties.url]));
const SRIR=new Set(DATA.features.filter(f=>f.properties.srir).map(f=>f.properties.name));
const STATUSES=[["operating","Operating","--op"],["planned","Planned","--plan"],["decommissioned","Decommissioned","--dec"]];

const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const feats=DATA.features.map(f=>{const p=f.properties;return{lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],...p,diam:p.circumference_m/Math.PI}});
const dmax=Math.max(...feats.map(f=>f.diam));
$("count").textContent=STATUSES.map(([k,l])=>feats.filter(f=>f.status===k).length+" "+l.toLowerCase()).join(" · ");
const STATUS_LABEL=Object.fromEntries(STATUSES.map(([k,l])=>[k,l]));
const RANK={operating:0,planned:1,decommissioned:2};
const hidden=new Set();                              // statuses switched off in the legend

function sizeOf(f){                                  // marker diameter in px (same as the Plotly page)
  if(!$("bysize").checked) return 11;
  const t=$("scale").checked?f.diam/dmax:Math.sqrt(f.diam/dmax);
  return 5+33*t;
}

// ---- Map style ---------------------------------------------------------------
// World overview: MapLibre's default demo style. From STREET_Z (past country
// level) on: OpenFreeMap "Liberty" street map (OpenStreetMap data, free, no key).
// Both are merged into ONE style, each layer limited to its zoom range, so the
// hand-over is seamless (no style reload). The demo font server also has the
// Noto fonts OpenFreeMap uses, so it serves the labels of both.
const DEMO_STYLE="https://demotiles.maplibre.org/style.json";
const STREET_STYLE="https://tiles.openfreemap.org/styles/liberty";
const STREET_Z=5;
async function buildStyle(){
  const get=u=>fetch(u).then(r=>{if(!r.ok) throw new Error(u+" "+r.status);return r.json()});
  const [demo,street]=await Promise.all([get(DEMO_STYLE),get(STREET_STYLE)]);
  const s={version:8,name:"Overview + streets",glyphs:demo.glyphs,sprite:street.sprite,sources:{},layers:[]};
  const add=(st,pre,zoom)=>{
    for(const [k,v] of Object.entries(st.sources)) s.sources[pre+k]=v;
    for(const l of st.layers){
      const r=zoom(l);
      if(r.minzoom>=r.maxzoom) continue;                // layer only exists outside this range
      s.layers.push({...l,id:pre+l.id,...(l.source?{source:pre+l.source}:{}),...r});
    }
  };
  add(demo,"overview-",l=>({minzoom:l.minzoom??0,maxzoom:Math.min(l.maxzoom??24,STREET_Z)}));
  add(street,"street-",l=>({minzoom:Math.max(l.minzoom??0,STREET_Z),maxzoom:l.maxzoom??24}));
  return s;
}
let STYLE;
try{STYLE=await buildStyle()}
catch(e){console.warn("Street map unavailable, using the overview style only:",e);STYLE=DEMO_STYLE}
const globe=()=>$("proj").checked;

// ---- Map ----------------------------------------------------------------------
// Default zoom: flat map ≈ full width; globe ≈ 90% of the box height
// (a globe at zoom z is 512·2^z/π px across).
const homeZoom=()=>{
  const el=$("map");
  return globe()?Math.log2(.9*Math.min(el.clientWidth,el.clientHeight)*Math.PI/512)
               :Math.max(0,Math.log2(el.clientWidth/512)-.15);
};
const HOME={center:[10,25]};
// Flat map limits (replaces MapLibre's default). Vertically the view never goes
// past the Arctic / Antarctic Circles (±66.56°): zooming out stops when the box
// spans exactly circle to circle, and panning stops at the circles, so the polar
// regions are never shown. Horizontally panning stops at the date line; on a box
// wider than the world at that zoom, the world stays centered. No world copies
// are drawn (renderWorldCopies:false). The globe is not limited.
const MAX_LAT=85.051129, POLAR_CIRCLE=66.5634;
const mercY=lat=>{const s=Math.sin(Math.max(-MAX_LAT,Math.min(MAX_LAT,lat))*Math.PI/180);return .5-Math.log((1+s)/(1-s))/(4*Math.PI)};
const latFromY=y=>Math.atan(Math.sinh(Math.PI*(1-2*y)))*180/Math.PI;
function constrainFlat(lngLat,zoom){
  if(globe()) return{center:lngLat,zoom};
  const el=$("map"), W=el.clientWidth, H=el.clientHeight;
  const yN=mercY(POLAR_CIRCLE), yS=mercY(-POLAR_CIRCLE);           // 0..1 world square
  zoom=Math.max(zoom,Math.log2(H/((yS-yN)*512)));                  // box ≤ circle-to-circle tall
  const ws=512*2**zoom;                                             // world size in px at this zoom
  const x=ws<=W?.5:Math.min(Math.max((lngLat.lng+180)/360,W/2/ws),1-W/2/ws);
  const y=Math.min(Math.max(mercY(lngLat.lat),yN+H/2/ws),yS-H/2/ws);
  return{center:new maplibregl.LngLat(x*360-180,latFromY(y)),zoom};
}
const map=new maplibregl.Map({
  container:"map", style:STYLE, center:HOME.center, zoom:homeZoom(),
  attributionControl:{compact:true}, canvasContextAttributes:{preserveDrawingBuffer:true},   // needed for Save PNG
  renderWorldCopies:false,         // draw the world once, even fully zoomed out (no repeated continents)
  transformConstrain:constrainFlat,   // …and still allow zooming out to the whole world (see above)
  dragRotate:false, pitchWithRotate:false, touchPitch:false, maxPitch:0   // north always up, no tilt
});
map.touchZoomRotate.disableRotation();               // pinch zooms but doesn't twist
map.keyboard.disableRotation();
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
map.addControl(new maplibregl.FullscreenControl({container:document.querySelector(".mapwrap")}),"top-right");
// Reset view (like Plotly's home button): world view, north up.
map.addControl({
  onAdd(){const d=document.createElement("div");d.className="maplibregl-ctrl maplibregl-ctrl-group";
    d.innerHTML='<button type="button" class="maplibregl-ctrl-reset" title="Reset view" aria-label="Reset view">⌂</button>';
    d.firstChild.onclick=()=>map.easeTo({center:HOME.center,zoom:homeZoom(),bearing:0,pitch:0});return d},
  onRemove(){}
},"top-right");

// ---- Overlapping markers: same rule as the Plotly page ------------------------
// Markers whose centers are closer than ~half a marker size merge into one group,
// led by the highest-priority facility (operating > planned > decommissioned,
// then larger ring). Hover lists all, click opens a link menu, a badge shows the count.
let groups=[];
function visible(f,margin=.02){                      // globe: is the point on the near side?
  if(!globe()) return true;
  const c=map.getCenter(), r=Math.PI/180, lo=f.lon*r, la=f.lat*r, clo=c.lng*r, cla=c.lat*r;
  return Math.sin(la)*Math.sin(cla)+Math.cos(la)*Math.cos(cla)*Math.cos(lo-clo)>margin;
}
function computeGroups(){
  const list=feats.filter(f=>!hidden.has(f.status)).sort((a,b)=>RANK[a.status]-RANK[b.status]||b.diam-a.diam);
  const xy=new Map(list.map(f=>{const q=visible(f)?map.project([f.lon,f.lat]):null;return[f,q&&[q.x,q.y]]}));
  const thr=(a,b)=>Math.max(6,(pinScale(a)+pinScale(b))/2*PIN_W*.5);   // half a pin head
  const out=[], used=new Set();
  for(const f of list){
    if(used.has(f)) continue;
    used.add(f);
    const g=[f], a=xy.get(f);
    if(a) for(const o of list){
      const b=xy.get(o);
      if(used.has(o)||!b) continue;
      if(Math.hypot(a[0]-b[0],a[1]-b[1])<thr(f,o)){g.push(o);used.add(o)}
    }
    out.push(g);
  }
  return out;
}
function hoverHtml(g){
  const ir=f=>$("srir").checked&&SRIR.has(f.name)?" · SR-IR":"";
  if(g.length===1){
    const f=g[0];
    return `<b>${f.name}</b><br>${f.city}, ${f.country}<br>${STATUS_LABEL[f.status]}${ir(f)}<br>`+
      `${f.energy_GeV} GeV · C = ${f.circumference_m} m · Ø ≈ ${f.diam.toFixed(0)} m`+
      (URLS[f.name]?"<br><i>Click to open website ↗</i>":"");
  }
  return `<b>${g.length} facilities</b><br>`+
    g.map(f=>`${f.name} — ${STATUS_LABEL[f.status]}, ${f.energy_GeV} GeV${ir(f)}`).join("<br>")+
    "<br><i>Click to choose a facility</i>";
}

// Marker layer: one circle per group leader, drawn operating-on-top.
// ---- Pins (Google-Maps style): teardrop, darker outline, dark center dot ------
// One icon per color, drawn on a canvas at 2× and tinted from the page's status
// colors; icon-size scales it per marker. The image is 14.5 × 19 px; pins are
// drawn at 0.8× that (≈ 11.6 × 15 px) at default size.
const PIN=new Path2D("M13.5 0C6.04 0 0 6.04 0 13.5C0 21 13.5 36 13.5 36S27 21 27 13.5C27 6.04 20.96 0 13.5 0Z");   // 27 × 36, shorter point
const PIN_W=14.5, PIN_H=19;
const pinScale=f=>.8*Math.sqrt(sizeOf(f)/11);      // 0.8× base; ring-size pins grow gently (√)
function shade(hex,k){                               // darken a #rrggbb color by k (0..1)
  const n=parseInt(hex.replace("#","").slice(0,6),16);
  const c=[n>>16,n>>8&255,n&255].map(v=>Math.round(v*(1-k)));
  return`rgb(${c.join(",")})`;
}
function pinImage(color){
  const k=2, c=document.createElement("canvas"); c.width=29*k; c.height=38*k;
  const x=c.getContext("2d"); x.scale(k,k); x.translate(1,1);
  x.fillStyle=color; x.fill(PIN);
  x.lineWidth=1.2; x.strokeStyle=shade(color,.35); x.stroke(PIN);
  x.beginPath(); x.arc(13.5,13.5,4.8,0,2*Math.PI); x.fillStyle=shade(color,.5); x.fill();
  return x.getImageData(0,0,c.width,c.height);
}
const pinColors={};                                  // icon name -> color it was drawn with
function ensurePins(){
  const want=Object.fromEntries([...STATUSES.map(([k,,t])=>["pin-"+k,css(t)]),["pin-accent",css("--accent")]]);
  for(const [name,color] of Object.entries(want)){
    if(map.hasImage(name)&&pinColors[name]===color) continue;
    const img=pinImage(color);
    map.hasImage(name)?map.updateImage(name,img):map.addImage(name,img,{pixelRatio:2});
    pinColors[name]=color;
  }
}

function featureCollection(){
  const byStatus=$("bystatus").checked, hl=$("srir").checked;
  return{type:"FeatureCollection",features:groups.map((g,i)=>{const f=g[0];return{type:"Feature",
    geometry:{type:"Point",coordinates:[f.lon,f.lat]},
    properties:{gi:i,s:pinScale(f),icon:byStatus?"pin-"+f.status:"pin-accent",
      op:hl&&!g.some(x=>SRIR.has(x.name))?.25:1,z:3-RANK[f.status]}}})};
}
function addLayers(){
  ensurePins();
  if(map.getSource("fac")) return;
  map.addSource("fac",{type:"geojson",data:featureCollection()});
  map.addLayer({id:"fac",type:"symbol",source:"fac",
    layout:{"icon-image":["get","icon"],"icon-size":["get","s"],"icon-anchor":"bottom",
      "icon-allow-overlap":true,"icon-ignore-placement":true,"symbol-sort-key":["get","z"]},
    paint:{"icon-opacity":["get","op"]}});
}
function update(){                                   // regroup + redraw markers, badges, legend
  if(!map.isStyleLoaded()&&!map.getSource("fac")) return;
  groups=computeGroups();
  if(map.isStyleLoaded()) ensurePins();               // colors may have changed (dark mode)
  const src=map.getSource("fac");
  if(src) src.setData(featureCollection());
  positionBadges(); drawLegend();
}

// Count badges: HTML dots that follow the map every frame.
const badgeLayer=$("badges");
function positionBadges(){
  const multi=groups.filter(g=>g.length>1);
  while(badgeLayer.children.length<multi.length) badgeLayer.appendChild(document.createElement("span")).className="badge";
  while(badgeLayer.children.length>multi.length) badgeLayer.lastChild.remove();
  multi.forEach((g,i)=>{
    const f=g[0], el=badgeLayer.children[i], vis=visible(f,.12);   // MapLibre hides pins a bit before the rim
    el.hidden=!vis;
    if(!vis) return;
    const q=map.project([f.lon,f.lat]), s=pinScale(f), w=PIN_W*s, h=PIN_H*s;
    el.textContent=g.length; el.style.left=(q.x+w*.42)+"px"; el.style.top=(q.y-h+w*.12)+"px";
  });
}

// Legend: click a status to hide/show it (like Plotly's legend).
function drawLegend(){
  const lg=$("legend");
  lg.hidden=!$("bystatus").checked;
  lg.innerHTML=STATUSES.map(([k,l,t])=>`<button type="button" data-k="${k}" class="${hidden.has(k)?"off":""}" aria-pressed="${!hidden.has(k)}">`+
    `<i style="background:${css(t)}"></i>${l} (${feats.filter(f=>f.status===k).length})</button>`).join("");
}
$("legend").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]");
  if(!b) return;
  const k=b.dataset.k; hidden.has(k)?hidden.delete(k):hidden.add(k); update();
});

// ---- Interaction ----------------------------------------------------------------
const tip=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:10,maxWidth:"340px"});
const groupAt=e=>groups[e.features[0].properties.gi];
// The hover box follows the pointer over pins. Clicking a single facility opens
// its website; clicking a grouped pin "pins" the hover box in place and expands
// it into a list of links, one per facility. It closes with ×, Esc, a click on
// the map, or after choosing a link.
let pinned=null;                                     // the group whose list is open
function showTip(g,lngLat,html){
  const s=pinScale(g[0]), w=PIN_W*s, h=PIN_H*s;
  tip.setOffset({"bottom":[0,-h-4],"top":[0,4],"left":[w/2+4,-h/2],"right":[-w/2-4,-h/2],
    "bottom-left":[w/2,-h],"bottom-right":[-w/2,-h],"top-left":[w/2,0],"top-right":[-w/2,0],"center":[0,-h/2]});
  tip.setLngLat(lngLat).setHTML(html).addTo(map);
}
function listHtml(g){
  return `<div class="tip-head"><b>${g.length} facilities</b><button type="button" class="tip-close" aria-label="Close">×</button></div>`+
    '<div class="tip-list">'+g.map(f=>{
      const u=URLS[f.name], body=`<span class="nm">${f.name}</span><span class="st">${STATUS_LABEL[f.status]} · ${f.city} · ${f.energy_GeV} GeV</span>`;
      return u?`<a href="${u}" target="_blank" rel="noopener">${body}</a>`:`<div class="nolink">${body}</div>`;
    }).join("")+"</div>";
}
function unpin(){if(pinned){pinned=null;tip.remove()}}
map.on("mousemove","fac",e=>{
  if(pinned) return;                                  // keep the open list where it is
  const g=groupAt(e);
  if(!g) return;
  showTip(g,[g[0].lon,g[0].lat],hoverHtml(g));
  map.getCanvas().style.cursor=g.length>1||URLS[g[0].name]?"pointer":"";
});
map.on("mouseleave","fac",()=>{map.getCanvas().style.cursor="";if(!pinned) tip.remove()});
map.on("click",e=>{
  const hit=map.queryRenderedFeatures(e.point,{layers:["fac"]})[0], g=hit&&groups[hit.properties.gi];
  if(!g){unpin();return}                               // click on the map: close the list
  if(g.length===1){unpin();const u=URLS[g[0].name];if(u) window.open(u,"_blank","noopener");return}
  openList(g);
  map.getCanvas().style.cursor="";
});
function openList(g){
  pinned=g;
  showTip(g,[g[0].lon,g[0].lat],listHtml(g));
  tip.getElement().querySelector(".tip-close").onclick=unpin;
  tip.getElement().querySelector(".tip-list").onclick=ev=>{if(ev.target.closest("a")) setTimeout(unpin)};
}
// After a zoom/pan the groups are rebuilt: keep the list open while its pin
// still leads a group, updating it if members changed; close it otherwise.
function refreshPinned(){
  if(!pinned) return;
  const g=groups.find(x=>x[0]===pinned[0]);
  if(!g||g.length<2){unpin();return}
  if(g.length!==pinned.length||g.some((f,i)=>f!==pinned[i])) openList(g); else pinned=g;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")unpin()});

// Once the style is loaded: apply the projection,
// then add the facility layer on top.
map.on("style.load",()=>{map.setProjection({type:globe()?"globe":"mercator"});addLayers();update()});
map.on("move",positionBadges);
map.on("moveend",()=>{update();refreshPinned()});
map.on("load",()=>{$("save").disabled=false});

// ---- Controls ---------------------------------------------------------------------
document.querySelectorAll(".switch input").forEach(inp=>inp.addEventListener("change",()=>{
  const [off,on]=inp.parentElement.querySelectorAll("span");
  off.classList.toggle("on",!inp.checked);on.classList.toggle("on",inp.checked);
}));
// Switching projection starts from that projection's default view (as on the Plotly page).
$("proj").addEventListener("change",()=>{
  map.setProjection({type:globe()?"globe":"mercator"});
  map.jumpTo({center:HOME.center,zoom:homeZoom(),bearing:0,pitch:0});
  update();
});
$("bysize").addEventListener("change",()=>{$("scale").disabled=!$("bysize").checked;update()});
["scale","bystatus","srir"].forEach(id=>$(id).addEventListener("change",update));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",update);

// ---- Save PNG: map canvas + badges + attribution ------------------------------------
async function savePNG(){
  await new Promise(ok=>{map.once("render",ok);map.triggerRepaint()});
  const src=map.getCanvas(), k=src.width/src.clientWidth;
  const c=document.createElement("canvas"); c.width=src.width; c.height=src.height;
  const ctx=c.getContext("2d"); ctx.fillStyle=css("--panel"); ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(src,0,0); ctx.scale(k,k);
  for(const el of badgeLayer.children){
    if(el.hidden) continue;
    const x=parseFloat(el.style.left), y=parseFloat(el.style.top);
    ctx.beginPath(); ctx.arc(x,y,8,0,2*Math.PI); ctx.fillStyle="#e5484d"; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle="#fff"; ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font=`700 10px ${css("--sans")}`; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(el.textContent,x,y+.5);
  }
  const attr=(document.querySelector(".maplibregl-ctrl-attrib-inner")||{}).textContent||"";   // the style's own credits
  if(attr){
    ctx.font=`10px ${css("--sans")}`; ctx.textAlign="right"; ctx.textBaseline="bottom";
    const w=ctx.measureText(attr).width+10, W=src.clientWidth, H=src.clientHeight;
    ctx.fillStyle="rgba(255,255,255,.8)"; ctx.fillRect(W-w,H-16,w,16); ctx.fillStyle="#333"; ctx.fillText(attr,W-5,H-3);
  }
  return new Promise(ok=>c.toBlob(ok,"image/png"));
}
$("save").addEventListener("click",async()=>{
  $("save").disabled=true; $("msg").textContent="Rendering…";
  try{
    const blob=await savePNG(), name="synchrotrons-"+(globe()?"globe":"mercator")+".png";
    const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name;
    document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000);
    $("msg").textContent="Saved "+name;
  }catch(e){$("msg").textContent="Couldn't save the PNG"+(e&&e.message?": "+e.message:".")}
  finally{$("save").disabled=false}
});

window.__atlas={map,get groups(){return groups},update};   // handy for debugging in the console
</script>
